name: cypress testes

on:
  workflow_dispatch:
    inputs:
      cli:
        description: Run by cypress command line
        default: yarn cypress run

jobs:
  cyrpess-electron-tests:
    runs-on: ubuntu-latest
    steps:
      - name: get code
        uses: actions/checkout@v2  # Corrigido para v2

      - name: install dependencies
        run: yarn install

      - name: Run E2E tests
        run: ${{github.event.inputs.cli}}
        
      - name: Upload Cypress Mochawesome report to GitHub Actions
        uses: actions/upload-artifact@v2  # Versão v2 está correta
        with:
          name: cypress-report
          path: cypress/reports

      - name: View Cypress report
        run: |
          echo "See Cypress test report at: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts"
