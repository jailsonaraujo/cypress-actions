name: cypress testes

on:
  workflow_dispatch:
    inputs:
      cli:
        description: Run by cypress command line
        default: yarn cypress run

jobs:
  cyrpess-electron-tests:
    runs-on: ubuntu-latest
    steps:
      - name: get code
        uses: actions/checkout@v4.2.2

      - name: install dependencies
        run: yarn install

      - name: Ruan E2E tests
        run: ${{github.event.inputs.cli}}
